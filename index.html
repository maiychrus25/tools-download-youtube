<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube → MP3</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #5b6270; --border: #d5d9e0; --accent: #d92d20; --accent-text: #fff; --ok: #067647; --err: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e25; --text: #eceef2; --muted: #a2a9b6; --border: #343a46; --accent: #f04438; --accent-text: #111318; --ok: #47cd89; --err: #fd853a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { margin: 0 0 16px; font-size: 1.375rem; }
  .intro, .hint { color: var(--muted); font-size: .875rem; }
  .intro { margin: -8px 0 24px; }
  .hint { margin: 6px 0 20px; }
  label { display: block; margin: 0 0 6px; font-size: .875rem; color: var(--muted); }
  input, select, button { width: 100%; min-height: 44px; font: inherit; border-radius: 8px; padding: 10px 12px; }
  input, select { border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 16px; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
  .check input { width: 20px; min-height: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: 0 0 auto; }
  #status { margin: 16px 0 0; min-height: 1.5em; overflow-wrap: anywhere; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  #status a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>YouTube → MP3</h1>
  <p class="intro">Dán link video để lưu âm thanh về máy.</p>
  <form id="form">
    <label for="url">Link video</label>
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    <label for="quality">Định dạng tải</label>
    <select id="quality">
      <option value="audio" selected>MP3 — chỉ âm thanh</option>
      <option value="best">Tốt nhất (MP4)</option>
      <option value="720p">720p (MP4)</option>
    </select>
    <label class="check" for="useCookies"><input id="useCookies" type="checkbox">Dùng phiên đăng nhập Chrome</label>
    <p class="hint">Chỉ bật khi video yêu cầu đăng nhập.</p>
    <button id="submit" type="submit">Tải MP3</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const form = document.getElementById("form");
  const button = document.getElementById("submit");
  const status = document.getElementById("status");
  const quality = document.getElementById("quality");
  const useCookies = document.getElementById("useCookies");
  const buttonLabel = () => quality.value === "audio" ? "Tải MP3" : "Tải MP4";
  quality.addEventListener("change", () => { button.textContent = buttonLabel(); });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    button.disabled = true;
    quality.disabled = true;
    useCookies.disabled = true;
    form.setAttribute("aria-busy", "true");
    button.textContent = "Đang tải...";
    status.className = "";
    status.textContent = quality.value === "audio" ? "Đang tải và chuyển thành MP3, video dài có thể mất vài phút..." : "Đang tải video, vui lòng chờ...";
    try {
      const res = await fetch("/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: document.getElementById("url").value, quality: quality.value, useCookies: useCookies.checked }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lỗi " + res.status);
      const link = document.createElement("a");
      link.href = data.href;
      link.download = data.name;
      link.textContent = data.name;
      status.className = "ok";
      status.replaceChildren("Đã tải: ", link);
      link.click();
    } catch (err) {
      status.className = "err";
      status.textContent = "Lỗi: " + err.message;
    } finally {
      button.disabled = false;
      quality.disabled = false;
      useCookies.disabled = false;
      form.setAttribute("aria-busy", "false");
      button.textContent = buttonLabel();
    }
  });
</script>
</body>
</html>
